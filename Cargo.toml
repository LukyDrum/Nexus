[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["LukyDrum"]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
fuzzy-matcher = "0.3.7"
iced = { version = "0.14.0", features = ["advanced", "image"] }
iced_layershell = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.1.2"
xdg = "3.0.0"
