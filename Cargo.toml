[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["LukyDrum"]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
fuzzy-matcher = "0.3.7"
iced = "0.14.0"
iced_layershell = "0.15.0"
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
xdg = "3.0.0"
